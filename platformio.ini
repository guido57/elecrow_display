[env:crowpanel_p4]
; pioarduino supplies ESP32-P4 support; upstream PlatformIO does not yet.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-p4
framework = arduino
board_build.variants_dir = variants
board_build.variant = elecrow_p4
; LVGL plus Wi-Fi needs more than the generic 1.25 MB app partition.
; This keeps a single 3 MB application slot (no OTA app slots).
board_build.partitions = huge_app.csv

; Build Elecrow's LVGL 9 touchscreen example for the 1024x600 Advance-P4.
build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/src
  ; Elecrow Advance-P4's onboard ESP32-C6 ESP-Hosted SDIO wiring.

upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = ${this.upload_port}
upload_speed = 921600
monitor_speed = 115200
monitor_filters = time

lib_deps =
    bblanchon/ArduinoJson
